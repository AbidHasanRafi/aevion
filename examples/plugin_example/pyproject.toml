[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-aevion-ext"
version = "0.1.0"
description = "Example plugin for Aevion"
requires-python = ">=3.10"
dependencies = ["aevion"]

[project.entry-points."aevion.plugins"]
my_aevion_ext = "my_aevion_ext:register"

[tool.setuptools]
packages = ["my_aevion_ext"]
