# A cellular-connected UAV in a city: geometric line-of-sight from ray casting, 3GPP UMa path loss, A3 handover, GNSS jamming.
# Validate with:  aevion validate examples/scenarios/wireless_city.yaml
# Run with:       aevion run examples/scenarios/wireless_city.yaml --out out --open
schema_version: 2
name: wireless_city
description: Orbit over a city between two macro sites, with a GNSS jammer switched on at t = 10 s.
seed: 5
duration: 20.0

world:
  type: city
  blocks: [4, 4]

trajectory: {type: circle, center: [0, 0, 70], radius: 60, omega: 0.3}

sensors:
  - {type: gps, record: true}

network:
  type: nr_cellular
  rate_hz: 10
  sites:
    - {pos: [-200, 0, 30], sectors: 1}
    - {pos: [250, 100, 30], sectors: 1}
  los_mode: geometric
  nlos_model: diffraction        # NLoS = free space + Bullington diffraction over the actual buildings
  propagation: {model: tr36777, scenario: umi_av}
  freq_hz: 3.5e9
  background_users: 2
  handover: {hysteresis_db: 2.0, time_to_trigger_s: 0.12}

faults:
  - {type: gnss_jamming, t_start: 10.0, t_end: 16.0, pos: [0, 0, 2], power_dbm: 25.0}
  - {type: network_jamming, t_start: 10.0, t_end: 16.0, pos: [0, 0, 2], power_dbm: 35.0}
