site_name: Aevion
site_description: CPU-first and GPU-ready UAV simulation with ML/DL integration, sensors, wireless links and research-grade figures.
site_url: https://aevion.readthedocs.io/
repo_url: https://github.com/aevion/aevion
repo_name: aevion/aevion
edit_uri: edit/main/
strict: true

# Every page (home, guide, API reference, CLI, gallery) is produced by this hook on every build,
# so `mkdocs build` / `mkdocs serve` work from a clean checkout.
hooks:
  - tools/mkdocs_hooks.py

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js

# Home (index.md) is generated from README.md and the guide (guide.md) from DOCUMENTATION.md; see tools/gen_site.py.
nav:
  - Home: index.md
  - Guide: guide.md
  - Gallery: gallery/index.md
  - Command line: cli.md
  - API reference: api/index.md

validation:
  omitted_files: info  # the API pages are reached from api/index.md
  absolute_links: warn
  unrecognized_links: warn
  anchors: info  # guide.md keeps GitHub-style anchors (tests/test_docs.py checks them); MkDocs numbers duplicate headings differently
